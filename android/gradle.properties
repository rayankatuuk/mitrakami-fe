# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ============================================================
# MEMORY OPTIMIZATION for low-RAM machines (3.5GB total)
# ============================================================

# Reduce Gradle daemon heap to 512MB (was 1536MB - too much for 3.5GB RAM)
org.gradle.jvmargs=-Xmx512m -XX:+UseSerialGC -XX:MaxMetaspaceSize=256m

# Disable Gradle daemon to free memory between builds
# On low-RAM machines, the daemon staying alive eats RAM
org.gradle.daemon=false

# Don't run in parallel - saves memory at cost of speed
org.gradle.parallel=false

# Run build operations in the same process
org.gradle.workers.max=1

# Disable configuration cache to save memory
org.gradle.configuration-cache=false

# AndroidX package structure
android.useAndroidX=true

# Kotlin/AGP optimizations
android.defaults.buildfeatures.buildconfig=true
